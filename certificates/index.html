<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificates — Neha R. Patil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../output.css" />

  <style>
    :root {
      --color-bg:         #0a0a0a;
      --color-surface:    #111111;
      --color-surface2:   #1a1a1a;
      --color-surface3:   #222222;
      --color-accent:     #00d4c8;
      --color-accent-dim: #00a89e;
      --color-text:       #f0ede8;
      --color-muted:      #6b7280;
      --color-muted2:     #9ca3af;
      --color-border:     #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
    }
    .font-display { font-family: 'Outfit', sans-serif; }

    /* ── Buttons ── */
    .btn-accent {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--color-accent); color: #0a0a0a;
      font-weight: 600; font-size: 0.875rem;
      padding: 0.7rem 1.4rem; border-radius: 0.5rem;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
    }
    .btn-accent:hover {
      background: var(--color-accent-dim);
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(0,212,200,0.3);
    }
    .btn-outline {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: transparent; color: var(--color-text);
      font-weight: 500; font-size: 0.875rem;
      padding: 0.7rem 1.4rem; border-radius: 0.5rem;
      border: 1px solid var(--color-border);
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
      text-decoration: none;
    }
    .btn-outline:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
      transform: translateY(-2px);
    }

    /* ── Filter tabs ── */
    .filter-btn {
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .filter-btn.active {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #0a0a0a;
      font-weight: 600;
    }

    /* ── Certificate card ── */
    .cert-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
      display: flex;
      flex-direction: column;
    }
    .cert-card:hover {
      border-color: rgba(0,212,200,0.35);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,212,200,0.15);
      transform: translateY(-4px);
    }
    .cert-thumb {
      position: relative;
      width: 100%;
      padding-top: 70%;
      overflow: hidden;
      background: var(--color-surface2);
    }
    .cert-thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .cert-card:hover .cert-thumb img {
      transform: scale(1.05);
    }
    .cert-thumb-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    .cert-thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(10,10,10,0.8));
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 1rem;
    }
    .cert-card:hover .cert-thumb-overlay {
      opacity: 1;
    }
    .cert-body {
      padding: 1rem 1.1rem 1.1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .cert-category-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
    .cert-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--color-text);
      line-height: 1.3;
    }
    .cert-org {
      font-size: 0.75rem;
      color: var(--color-muted);
    }

    /* ── Lightbox ── */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    #lightbox.open {
      opacity: 1;
      pointer-events: all;
    }
    #lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(8px);
    }
    #lightbox-box {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      border-radius: 1.25rem;
      overflow: hidden;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      transform: scale(0.96);
      transition: transform 0.25s;
    }
    #lightbox.open #lightbox-box {
      transform: scale(1);
    }
    #lightbox-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    #lightbox-iframe-wrap {
      flex: 1;
      min-height: 0;
      height: 70vh;
    }
    #lightbox-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #lightbox-close {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    #lightbox-close:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    /* ── Reveal ── */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ── Section label ── */
    .section-label {
      font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-accent);
    }

    /* ── Hidden card state ── */
    .cert-card.hidden-card {
      display: none;
    }

    /* ── Stats counter ── */
    #visible-count { color: var(--color-accent); }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header style="border-bottom: 1px solid var(--color-border); background: rgba(10,10,10,0.9); backdrop-filter: blur(12px);" class="sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="../index.html" class="btn-outline py-2 px-3 text-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Back to Portfolio</span>
      </a>
      <div class="flex items-center gap-3">
        <div>
          <div id="cert-name" class="font-display font-semibold text-sm leading-none" style="color: var(--color-text);"></div>
          <div class="text-xs" style="color: var(--color-muted);">Certificates &amp; Achievements</div>
        </div>
      </div>
      <a href="../cv/index.html" class="btn-accent py-2 px-4 text-sm">
        <i data-lucide="file-text" class="w-4 h-4"></i>
        <span class="hidden sm:inline">View CV</span>
      </a>
    </div>
  </header>

  <!-- ── Hero ── -->
  <section class="pt-16 pb-12 px-4 sm:px-6 lg:px-8" style="background: radial-gradient(ellipse 80% 60% at 50% -5%, rgba(0,212,200,0.1) 0%, transparent 70%);">
    <div class="max-w-7xl mx-auto text-center">
      <span class="section-label flex items-center justify-center gap-2 mb-4">
        <span style="color: var(--color-accent);">✦</span> Achievements &amp; Learning
      </span>
      <h1 class="font-display font-black mb-4" style="font-size: clamp(2.5rem, 6vw, 5rem); color: var(--color-text); line-height: 1.0;">
        My Certificates
      </h1>
      <p class="text-base max-w-xl mx-auto mb-8" style="color: var(--color-muted2);" id="cert-description">
        <!-- Populated by JS -->
      </p>
      <!-- Stats row -->
      <div id="cert-stats" class="flex flex-wrap justify-center gap-6">
        <!-- Populated by JS -->
      </div>
    </div>
  </section>

  <!-- ── Filters ── -->
  <div class="sticky top-16 z-40 px-4 sm:px-6 lg:px-8 py-4" style="background: rgba(10,10,10,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-border);">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
      <div id="filter-bar" class="flex flex-wrap gap-2">
        <!-- Populated by JS -->
      </div>
      <div class="text-xs" style="color: var(--color-muted);">
        Showing <span id="visible-count">0</span> certificates
      </div>
    </div>
  </div>

  <!-- ── Grid ── -->
  <main class="px-4 sm:px-6 lg:px-8 py-10">
    <div class="max-w-7xl mx-auto">
      <div id="cert-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
        <!-- Populated by JS -->
      </div>

      <!-- Empty state -->
      <div id="empty-state" class="hidden text-center py-20">
        <i data-lucide="search-x" class="w-16 h-16 mx-auto mb-4" style="color: var(--color-muted);"></i>
        <h3 class="font-display font-bold text-xl mb-2" style="color: var(--color-text);">No certificates found</h3>
        <p class="text-sm" style="color: var(--color-muted);">Try selecting a different category.</p>
      </div>
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer class="py-8 px-4 sm:px-6 lg:px-8" style="border-top: 1px solid var(--color-border);">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <p id="cert-copyright" class="text-xs" style="color: var(--color-muted);"></p>
      <div class="flex items-center gap-3">
        <a href="../index.html" class="btn-outline py-2 px-4 text-sm">
          <i data-lucide="home" class="w-4 h-4"></i> Portfolio
        </a>
        <a href="../cv/index.html" class="btn-accent py-2 px-4 text-sm">
          <i data-lucide="file-text" class="w-4 h-4"></i> View CV
        </a>
      </div>
    </div>
  </footer>

  <!-- ── Lightbox ── -->
  <div id="lightbox">
    <div id="lightbox-backdrop" onclick="closeLightbox()"></div>
    <div id="lightbox-box">
      <div id="lightbox-header">
        <div>
          <div id="lightbox-title" class="font-display font-semibold text-sm" style="color: var(--color-text);"></div>
          <div id="lightbox-org" class="text-xs" style="color: var(--color-muted);"></div>
        </div>
        <div class="flex items-center gap-2">
          <a id="lightbox-download" href="#" download class="btn-accent py-2 px-3 text-xs">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Download
          </a>
          <a id="lightbox-open" href="#" target="_blank" rel="noopener" class="btn-outline py-2 px-3 text-xs">
            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          </a>
          <button id="lightbox-close" onclick="closeLightbox()">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      <div id="lightbox-iframe-wrap">
        <iframe id="lightbox-iframe" title="Certificate Viewer"></iframe>
      </div>
    </div>
  </div>

  <script>
    // ── Category style map ──
    const CAT_STYLES = {
      competition: { badge: 'background:rgba(251,191,36,0.12);color:#fbbf24;', icon: 'trophy',    label: 'Competition' },
      course:      { badge: 'background:rgba(0,212,200,0.1);color:var(--color-accent);', icon: 'monitor', label: 'Online Course' },
      programming: { badge: 'background:rgba(139,92,246,0.12);color:#a78bfa;', icon: 'code',      label: 'Programming' },
      sports:      { badge: 'background:rgba(34,197,94,0.1);color:#4ade80;',   icon: 'medal',     label: 'Sports' },
      other:       { badge: 'background:rgba(251,146,60,0.1);color:#fb923c;',  icon: 'star',      label: 'Other' },
    };

    // Default icon for category placeholder
    const CAT_THUMB_ICONS = {
      competition: 'trophy',
      course:      'sparkles',
      programming: 'code-2',
      sports:      'medal',
      other:       'award',
    };

    // Stats display: which categories to show in hero stats row (skip "all")
    // (uses categories from data.json, minus "all")

    let allCards = [];

    // ── Build one card element ──
    function buildCard(cert, index) {
      const style = CAT_STYLES[cert.category] || CAT_STYLES.other;
      const thumbIcon = CAT_THUMB_ICONS[cert.category] || 'award';
      const delay = (index % 4) * 0.05;

      const card = document.createElement('div');
      card.className = 'cert-card reveal';
      card.dataset.category = cert.category;
      card.dataset.pdf = cert.pdf;
      card.dataset.title = cert.title;
      card.dataset.org = cert.org;
      if (delay > 0) card.style.transitionDelay = `${delay}s`;

      card.innerHTML = `
        <div class="cert-thumb">
          <div class="cert-thumb-placeholder">
            <i data-lucide="${thumbIcon}" style="width:2.5rem;height:2.5rem;color:var(--color-accent);opacity:0.5;"></i>
            <span style="font-size:0.7rem;color:var(--color-muted);text-align:center;padding:0 1rem;">PDF Preview</span>
          </div>
          <div class="cert-thumb-overlay">
            <span style="color:white;font-size:0.75rem;font-weight:600;display:flex;align-items:center;gap:0.4rem;">
              <i data-lucide="eye" style="width:1rem;height:1rem;"></i> View Certificate
            </span>
          </div>
        </div>
        <div class="cert-body">
          <span class="cert-category-badge" style="${style.badge}">
            <i data-lucide="${style.icon}" style="width:0.6rem;height:0.6rem;"></i> ${style.label}
          </span>
          <div class="cert-title">${cert.title}</div>
          <div class="cert-org">${cert.org}</div>
        </div>
      `;

      card.addEventListener('click', () => openLightbox(card));
      return card;
    }

    // ── Lightbox ──
    const lightbox    = document.getElementById('lightbox');
    const lbIframe    = document.getElementById('lightbox-iframe');
    const lbTitle     = document.getElementById('lightbox-title');
    const lbOrg       = document.getElementById('lightbox-org');
    const lbDownload  = document.getElementById('lightbox-download');
    const lbOpen      = document.getElementById('lightbox-open');

    function openLightbox(card) {
      const pdf = card.dataset.pdf;
      lbTitle.textContent    = card.dataset.title;
      lbOrg.textContent      = card.dataset.org;
      lbDownload.href        = pdf;
      lbOpen.href            = pdf;
      lbIframe.src           = pdf + '#toolbar=1';
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
      lucide.createIcons();
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => { lbIframe.src = ''; }, 300);
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ── Scroll reveal ──
    const revealObs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); revealObs.unobserve(e.target); }
      });
    }, { threshold: 0.1 });

    // ── Filter logic ──
    function applyFilter(cat) {
      let count = 0;
      allCards.forEach(card => {
        const match = cat === 'all' || card.dataset.category === cat;
        card.classList.toggle('hidden-card', !match);
        if (match) count++;
      });
      document.getElementById('visible-count').textContent = count;
      document.getElementById('empty-state').classList.toggle('hidden', count > 0);
    }

    // ── WebP thumbnail attempt ──
    function tryLoadThumb(card) {
      const pdfPath = card.dataset.pdf;
      if (!pdfPath) return;
      const filename = pdfPath.split('/').pop().replace(/\.pdf$/i, '');
      const webpSrc = `./webp/${filename}.webp`;
      const img = new Image();
      img.onload = () => {
        const thumb = card.querySelector('.cert-thumb');
        const placeholder = card.querySelector('.cert-thumb-placeholder');
        if (placeholder) placeholder.style.display = 'none';
        img.alt = card.dataset.title || 'Certificate';
        img.loading = 'lazy';
        thumb.insertBefore(img, thumb.querySelector('.cert-thumb-overlay'));
      };
      img.src = webpSrc;
    }

    // ── Main init ──
    async function init() {
      const data = await fetch('../data.json').then(r => r.json());
      const { certificates, person, meta } = data;

      // Page title & name
      document.title = `Certificates — ${person.fullName}`;
      document.getElementById('cert-name').textContent = person.fullName;
      document.getElementById('cert-copyright').textContent = meta.copyright;

      // Hero description
      document.getElementById('cert-description').innerHTML =
        `A collection of <span style="color:var(--color-accent);font-weight:600;">${certificates.totalCount}</span> ${certificates.description.replace(/^A collection of \d+ certificates? /, '')}`;

      // Hero stats (all categories except "all")
      const statsEl = document.getElementById('cert-stats');
      certificates.categories
        .filter(c => c.key !== 'all')
        .forEach(cat => {
          const div = document.createElement('div');
          div.className = 'text-center';
          div.innerHTML = `
            <div class="text-2xl font-display font-bold" style="color:var(--color-accent);">${cat.count}</div>
            <div class="text-xs" style="color:var(--color-muted);">${cat.label}</div>
          `;
          statsEl.appendChild(div);
        });

      // Filter buttons
      const filterBar = document.getElementById('filter-bar');
      certificates.categories.forEach((cat, i) => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (i === 0 ? ' active' : '');
        btn.dataset.category = cat.key;
        btn.innerHTML = `${cat.label} <span class="ml-1 opacity-70">(${cat.count})</span>`;
        btn.addEventListener('click', () => {
          filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyFilter(cat.key);
        });
        filterBar.appendChild(btn);
      });

      // Build grid
      const grid = document.getElementById('cert-grid');
      certificates.list.forEach((cert, i) => {
        const card = buildCard(cert, i);
        allCards.push(card);
        grid.appendChild(card);
        revealObs.observe(card);
        tryLoadThumb(card);
      });

      // Initial count
      document.getElementById('visible-count').textContent = certificates.list.length;

      lucide.createIcons();
    }

    init();
  </script>
</body>
</html>
