<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV — Neha R. Patil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../output.css" />

  <style>
    :root {
      --color-bg:         #0a0a0a;
      --color-surface:    #111111;
      --color-surface2:   #1a1a1a;
      --color-accent:     #00d4c8;
      --color-accent-dim: #00a89e;
      --color-text:       #f0ede8;
      --color-muted:      #6b7280;
      --color-border:     #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
    }
    .font-display { font-family: 'Outfit', sans-serif; }
    .btn-accent {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--color-accent); color: #0a0a0a;
      font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 0.875rem;
      padding: 0.7rem 1.4rem; border-radius: 0.5rem;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
    }
    .btn-accent:hover {
      background: var(--color-accent-dim);
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(0,212,200,0.3);
    }
    .btn-outline {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: transparent; color: var(--color-text);
      font-family: 'Outfit', sans-serif; font-weight: 500; font-size: 0.875rem;
      padding: 0.7rem 1.4rem; border-radius: 0.5rem;
      border: 1px solid var(--color-border);
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
      text-decoration: none;
    }
    .btn-outline:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
      transform: translateY(-2px);
    }
    .pdf-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #pdf-embed {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: none;
    }
    .pdf-fallback {
      display: none;
    }
  </style>
</head>

<body>
  <!-- ── Topbar ── -->
  <header style="border-bottom: 1px solid var(--color-border); background: rgba(10,10,10,0.9); backdrop-filter: blur(12px);" class="sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="../index.html" class="btn-outline py-2 px-3 text-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Back to Portfolio</span>
      </a>

      <div class="flex items-center gap-3">
        <div>
          <div id="cv-name" class="font-display font-semibold text-sm leading-none" style="color: var(--color-text);">Neha R. Patil</div>
          <div class="text-xs" style="color: var(--color-muted);">Curriculum Vitae</div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a id="cv-download-btn" href="#" download class="btn-accent py-2 px-4 text-sm">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Download CV</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ── Info bar ── -->
  <div class="px-4 sm:px-6 lg:px-8 py-4" style="background: var(--color-surface); border-bottom: 1px solid var(--color-border);">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 text-sm" style="color: var(--color-muted);">
        <i data-lucide="file-text" class="w-4 h-4" style="color: var(--color-accent);"></i>
        <span id="cv-filename">CV-Neha Patil.pdf</span>
      </div>
      <div id="cv-infobar" class="flex flex-wrap items-center gap-4 text-xs" style="color: var(--color-muted);">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- ── PDF viewer ── -->
  <div class="pdf-wrapper px-4 sm:px-6 lg:px-8 py-6" style="min-height: calc(100vh - 8rem);">
    <div class="max-w-5xl mx-auto h-full flex flex-col gap-4">

      <div class="flex items-center justify-between">
        <span class="text-xs" style="color: var(--color-muted);">
          Tip: Use browser controls to zoom, print, or navigate pages.
        </span>
        <a id="cv-newtab-btn" href="#" target="_blank" rel="noopener" class="btn-outline py-1.5 px-3 text-xs">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Open in New Tab
        </a>
      </div>

      <div class="flex-1 rounded-xl overflow-hidden" style="border: 1px solid var(--color-border); min-height: 80vh;">
        <iframe
          id="pdf-embed"
          src=""
          title="Neha Patil CV"
          style="width:100%; height:80vh; border:none;"
        ></iframe>

        <div class="pdf-fallback" id="pdf-fallback" style="display:none; padding: 3rem; text-align: center;">
          <i data-lucide="file-warning" class="w-16 h-16 mx-auto mb-4" style="color: var(--color-muted);"></i>
          <h3 class="font-display font-bold text-xl mb-2" style="color: var(--color-text);">PDF Preview Unavailable</h3>
          <p class="text-sm mb-6" style="color: var(--color-muted);">Your browser doesn't support inline PDF viewing.</p>
          <a id="cv-fallback-download" href="#" download class="btn-accent">
            <i data-lucide="download" class="w-4 h-4"></i> Download CV Instead
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Footer ── -->
  <footer class="py-6 px-4 sm:px-6 lg:px-8" style="border-top: 1px solid var(--color-border);">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <p id="cv-copyright" class="text-xs" style="color: var(--color-muted);"></p>
      <div class="flex items-center gap-3">
        <a href="../index.html" class="btn-outline py-2 px-4 text-sm">
          <i data-lucide="home" class="w-4 h-4"></i> Portfolio
        </a>
        <a href="../certificates/index.html" class="btn-outline py-2 px-4 text-sm">
          <i data-lucide="award" class="w-4 h-4"></i> Certificates
        </a>
        <a id="cv-footer-download" href="#" download class="btn-accent py-2 px-4 text-sm">
          <i data-lucide="download" class="w-4 h-4"></i> Download
        </a>
      </div>
    </div>
  </footer>

  <script>
    // Infobar icon map: index → lucide icon name
    const infoIcons = ['file-text', 'map-pin', 'mail', 'graduation-cap'];

    async function init() {
      const data = await fetch('../data.json').then(r => r.json());
      const { cv, person, meta } = data;

      // Name
      document.getElementById('cv-name').textContent = person.fullName;

      // PDF file path
      const pdfPath = cv.pdfFile; // "./CV-Neha Patil.pdf" relative to cv/
      const iframe = document.getElementById('pdf-embed');
      iframe.src = pdfPath + '#view=FitH&toolbar=1';

      // Buttons
      document.getElementById('cv-download-btn').href = pdfPath;
      document.getElementById('cv-newtab-btn').href = pdfPath;
      document.getElementById('cv-fallback-download').href = pdfPath;
      document.getElementById('cv-footer-download').href = pdfPath;

      // Filename
      const filename = pdfPath.replace('./', '');
      document.getElementById('cv-filename').textContent = filename;

      // Info bar items (skip first — that's the filename already shown on the left)
      const infoBar = document.getElementById('cv-infobar');
      cv.infoBar.slice(1).forEach((item, i) => {
        const icon = infoIcons[i + 1] || 'info';
        const span = document.createElement('span');
        span.className = 'flex items-center gap-1.5';
        span.innerHTML = `<i data-lucide="${icon}" class="w-3.5 h-3.5" style="color: var(--color-accent);"></i>${item}`;
        infoBar.appendChild(span);
      });

      // Copyright
      document.getElementById('cv-copyright').textContent = meta.copyright;

      // Title
      document.title = `CV — ${person.fullName}`;

      lucide.createIcons();

      // PDF embed fallback
      iframe.addEventListener('error', () => {
        iframe.style.display = 'none';
        document.getElementById('pdf-fallback').style.display = 'block';
      });
      setTimeout(() => {
        const ua = navigator.userAgent.toLowerCase();
        if (/android|iphone|ipad|ipod/.test(ua)) {
          iframe.style.display = 'none';
          document.getElementById('pdf-fallback').style.display = 'block';
        }
      }, 500);
    }

    init();
  </script>
</body>
</html>
